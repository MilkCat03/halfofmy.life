<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/comic-mono@0.0.1/index.css">
    <title>halfofmy.life</title>
    <style>
        *{
            overflow-x: hidden;        }

        html {
            font-family: "Comic Mono";
            color:white;
            background-image: url("background.jpg");
            background-size:auto;
            background-position: center;
            background-repeat: repeat;
        }

        body {
            width: 100%;
            height: 100%;
            margin: 15px;
            background-color: transparent;
        }

        #content {
            padding: 15px;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            background-color: rgba(0, 0, 0, 0.8);
            width: 96.3%;
            height: auto;
            margin-top:5px;    
        }

        h1 {
            font-size: 50px;
            margin-top: 10px;
            margin-bottom: 10px;
            color:white;
            text-align:center;
            -webkit-text-stroke: 3px black;

        }

        iframe {
            width: 98%;
            height: 100%;
            min-height: 250px;
            border: none;
            margin: 0;
            padding: 0;
            display: block;
        }
        
        #container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }

        #container img {
            max-height: 520px;
            height: auto;
            width: auto;
            object-fit: contain;
        }
        
        a{
            color:aqua;
        }

        .gallerySection {
            margin-bottom: 30px;
        }

        .gallerySection h3 {
            margin-bottom: 15px;
        }

        .sectionDivider {
            display: block;
            width: min(720px, 92%);
            max-height: 220px;
            object-fit: cover;
            margin: 0 auto 18px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.5);
        }

        .galleryContent {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
            justify-content: center;
            width:95%;  
        }

        .galleryContent img {
            width: 100%;
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        @media (max-width: 800px) {
            .galleryContent {
                grid-template-columns: 1fr;
            }
        }

        h3{
            font-size: 40px;
            margin-top: 10px;
            margin-bottom: 10px;
            color:white;
            text-align:center;
            -webkit-text-stroke: 3px black;
        }

        p{
            font-size: 25px;
            text-align: center;
            -webkit-text-stroke: 1px black;
        }

    </style>
    <script src="onmobile.js"></script>
</head>
<body> 
    <iframe src="../header.html"></iframe>

        <hr>

            titleElement.innerHTML = `<b>${section.title}</b>`;

            const dividerImage = document.createElement('hr');

            const contentElement = document.createElement('div');
            contentElement.className = 'galleryContent';

            section.images.forEach((src) => {
                const image = document.createElement('img');
                image.src = src;
                image.alt = section.title;
                contentElement.appendChild(image);
            });

            const dividerImage2 = document.createElement('hr');

            sectionElement.appendChild(titleElement);

            sectionElement.appendChild(contentElement);
