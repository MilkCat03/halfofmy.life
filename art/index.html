<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/comic-mono@0.0.1/index.css">
    <title>halfofmy.life</title>
    <style>
        *{
            overflow-x: hidden;        }

        html {
            font-family: "Comic Mono";
            color:white;
            background-image: url("background.jpg");
            background-size:auto;
            background-position: center;
            background-repeat: repeat;
        }

        body {
            width: 100%;
            height: 100%;
            margin: 15px;
            background-color: transparent;
        }

        #content {
            padding: 15px;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            background-color: rgba(0, 0, 0, 0.8);
            width: 96.3%;
            height: auto;
            margin-top:5px;    
        }

        h1 {
            font-size: 50px;
            margin-top: 10px;
            margin-bottom: 10px;
            color:rgb(0, 217, 255);
            text-align:center;
            -webkit-text-stroke: 3px black;

        }

        iframe {
            width: 98%;
            height: 100%;
            min-height: 250px;
            border: none;
            margin: 0;
            padding: 0;
            display: block;
        }
        
        #container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }

        #container img {
            max-height: 520px;
            height: auto;
            width: auto;
            object-fit: contain;
        }
        
        a{
            color:aqua;
        }

        .gallerySection {
            margin-bottom: 30px;
            scroll-margin-top: 120px;
        }

        .gallerySection h3 {
            margin-bottom: 15px;
        }

        .sectionDivider {
            display: block;
            width: min(900px, 92%);
            max-height: 4500px;
            object-fit: cover;
            margin: 0 auto 18px;
        }

        .galleryContent {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, min(900px, 100%)));
            gap: 15px;
            justify-content: center;
            align-items: start;
            width: min(100%, 2000px);
            margin: 0 auto;
        }

        .galleryContent img {
            width: 100%;
            max-width: 100%;
            height: auto;
            object-fit: contain;
            cursor: zoom-in;        
        }

        .imageModal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 1000;
        }

        .imageModal.open {
            display: flex;
        }

        .imageModal img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .imageModalClose {
            position: absolute;
            top: 18px;
            right: 22px;
            background: transparent;
            border: none;
            color: white;
            font-size: 42px;
            cursor: pointer;
            line-height: 1;
            overflow: hidden;
        }

        body.modal-open {
            overflow: hidden;
        }

        @media (max-width: 800px) {
            .galleryContent {
                grid-template-columns: 1fr;
            }
        }

        h3{
            font-size: 40px;
            margin-top: 10px;
            margin-bottom: 10px;
            color:rgb(183, 250, 255);
            text-align:center;
            -webkit-text-stroke: 3px black;
        }

        p{
            font-size: 25px;
            text-align: center;
            -webkit-text-stroke: 1px black;
        }

    </style>
    <script src="onmobile.js"></script>
</head>
<body> 
    <iframe src="../header.html"></iframe>
    <div id="content">
        <hr>
        <h1><b>my art!</b></h1>
        <hr>
        <p>
            i've procrastinated this part of the website for way too long. but now it's here.
            <br>
            art projects ive worked on in the past. physical and drawn.
            <br>
            hope you enjoy.
        </p>
        <hr>
        <div id="gallery"></div>
    </div>
    <div id="imageModal" class="imageModal" aria-hidden="true">
        <button id="imageModalClose" class="imageModalClose" aria-label="Close image">&times;</button>
        <img id="imageModalImage" alt="Expanded artwork">
    </div>

                ]

        ];

        const galleryRoot = document.getElementById('gallery');
        const imageModal = document.getElementById('imageModal');
        const imageModalImage = document.getElementById('imageModalImage');
        const imageModalClose = document.getElementById('imageModalClose');

        function openImage(src, alt) {
            imageModalImage.src = src;
            imageModalImage.alt = alt;
            imageModal.classList.add('open');
            imageModal.setAttribute('aria-hidden', 'false');
            document.body.classList.add('modal-open');
        }

        function closeImage() {
            imageModal.classList.remove('open');
            imageModal.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('modal-open');
            imageModalImage.removeAttribute('src');
            imageModalImage.alt = '';
        }

        imageModalClose.addEventListener('click', closeImage);
        imageModal.addEventListener('click', (event) => {
            if (event.target === imageModal) {
                closeImage();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeImage();
            }
        });

        gallerySections.forEach((section) => {
            const sectionElement = document.createElement('section');
            sectionElement.className = 'gallerySection';
            sectionElement.id = section.title;

            const titleElement = document.createElement('h3');
            titleElement.innerHTML = `<b>${section.title}</b>`;

            const dividerImage = document.createElement('hr');

            const contentElement = document.createElement('div');
            contentElement.className = 'galleryContent';

            section.images.forEach((src) => {
                const image = document.createElement('img');
                image.src = src;
                image.alt = section.title;
                image.addEventListener('click', () => openImage(src, section.title));
                contentElement.appendChild(image);
            });

            const dividerImage2 = document.createElement('hr');

            sectionElement.appendChild(titleElement);
            sectionElement.appendChild(dividerImage);
            sectionElement.appendChild(contentElement);
            sectionElement.appendChild(dividerImage2);
            galleryRoot.appendChild(sectionElement);
        });
    </script>
</body>
</html>
