<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Spongebob Art</title>
        <style>
            body{
                font-family: 'Comic Sans MS';
                background: linear-gradient(rgb(53, 9, 45), rgb(4, 10, 31));
                min-height: 100vh;
                margin: 0;
                
            }

            #home{
                font-size: 3rem;
                color: rgb(255, 255, 255);
                padding: 0.5rem 0.75rem;
                text-decoration: none;
                margin: 1rem;
                position: fixed;
                bottom:10px;
                right:10px;
                background: linear-gradient(rgb(171, 205, 175), rgb(80, 80, 80));

            }

            #images{
                column-count: 3;
                column-gap: 1rem;
                padding: 1rem;
            }

            #images img{
                width: 100%;
                height: auto;
                display: block;
                margin: 0 0 1rem;
                break-inside: avoid;
                -webkit-column-break-inside: avoid;
                -moz-column-break-inside: avoid;
            }

            @media (max-width: 900px){
                #images{ column-count: 2; }
            }

            @media (max-width: 600px){
                #images{ column-count: 1; }
            }

            h1{
                background: linear-gradient(lightgreen, azure);
                text-align: center;
                margin:0px;
                text-shadow: 2px 2px 4px rgb(211, 218, 6);
                padding:20px;
            }
            
            hr{
                height:5px;
                background-color: rgb(211, 218, 6);
                margin:0px;
            }

            #footer{
                background: linear-gradient(azure, rgb(199, 255, 199));
            }
        </style>
    </head>
    <body>
        <a id="home" href="../../index.html">🏘</a>
        <div id="header">
            <hr>
                <h1>spunchbop's spongebobs @ halfofmy.life</h1>
            <hr>
        </div>
        <div id="images">
            <img src="images/hi-im-spongebob.png" alt="hi im spongebob">
            <img src="images/jellyfishing.png" alt="jellyfishing">
            <img src="images/lil-guy.jpg" alt="lil guy">
            <img src="images/spanish-class.jpg" alt="spanish class">
            <img src="images/uncolored-rainbow.jpg" alt="uncolored rainbow">
            <img src="images/colored-rainbow.jpg" alt="colored rainbow">
        </div>
        <div id="footer" style="text-align: center;">
            <hr>
            <p style="color:blue;">☺ made with EXTRA love, spunchbop at halfofmy.life ☺</p>
            <p>issues? contact me: <a href="../../contact/index.html">here!</a></p>
            <hr>
        </div>
    </body>
</html>
