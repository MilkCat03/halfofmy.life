<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>halfofmy.life - my music</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/comic-mono@0.0.1/index.css">
        <link rel="stylesheet" href="../theme.css">
        <style>
        html{
            background-image: url('../../media/space.jpg');
            text-align: center;
        }

        a{
            color:yellow;
        }

        .collapsed{
            display: none;
        }
        </style>
    </head>
    <body>
        <div id="content">
            <iframe src="../header.html"></iframe>
            <br>
            
            <div id="fullsongs">
                <h1>full songs: <button onclick="toggleSection('fullsongs-content')">hide/show</button></h1>
                <hr>
                <div id="fullsongs-content">
                    <p>i only archive songs im proud of</p>
                    <a href="i dont know why/">i dont know why/a dissapointment to my family</a>
                    <br>
                    
                </div>
            </div>
            <hr>

            <div id="demos">
                <h1>demos: <button onclick="toggleSection('demos-content')">hide/show</button></h1>
                <hr>
                <div id="demos-content">
                    <p>demos im working on, actively or inactively</p>
                    <a href="like emo or sum idfk/">like emo or sum idfk/i've</a>
                </div>
            </div>
            <hr>

            <div id="audiofragments">
                <h1>audio fragments: <button onclick="toggleSection('audiofragments-content')">hide/show</button></h1>
                <hr>
                <div id="audiofragments-content">
                    <p>things i made that dont really have a place yet</p>
                    
                </div>
            </div>
            <hr>

            <div id="lyricalfragments">
                <h1>lyrical fragments/poetry: <button onclick="toggleSection('lyricalfragments-content')">hide/show</button></h1>
                <hr>
                <div id="lyricalfragments-content">
                    <p>poetry or lyrical fragments</p>
                    
                </div>
            </div>
        </div>

        <script>
            function toggleSection(sectionId) {
                var section = document.getElementById(sectionId);
                if (section.style.display === "none") {
                    section.style.display = "block";
                } else {
                    section.style.display = "none";
                }
            }
        </script>
    </body>
</html>
