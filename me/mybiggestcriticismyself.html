<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" media="screen" href="https://fontlibrary.org//face/comic-relief" type="text/css"/> 
    <title>my biggest critic is myself</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #fff;
        color: #000;
        font-family: 'ComicReliefRegular'; 
      }

      body {
        display: flex;
        justify-content: center;
      }

      #content {
        width: min(90vw, 500px);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 42vh 0;
      }

      .word {
        position: relative;
        font-size: clamp(1rem, 6vw, 7rem);
        line-height: 1;
        letter-spacing: 0.08em;
        text-transform: lowercase;
        white-space: nowrap;
      }

      p{
        text-align: center;
        position: absolute;
        font-size: 1.6rem;
      }
    </style>
  </head>
  <body>
    <p>
        Better
        <br>
        Stronger, happier
        <br>
        Overworking, compensating, terrifying
        <br>
        Paperwork, assignments, employment, opportunities
        <br>
        Lazing, slacking, disappointing
        <br>
        Disgusting, dirty
        <br>
        Worse
    </p>
    <div id="content"></div>

    <script>
      const words = ["my", "biggest", "critic", "is", "myself"];
      const content = document.getElementById("content");
      const maxOffset = window.innerWidth / 10;
      let wordIndex = 0;

      function appendWords() {
        const fragment = document.createDocumentFragment();

        for (let i = 0; i < 40; i++) {
          const div = document.createElement("div");
          const offset = Math.floor(Math.random() * (maxOffset * 2 + 1)) - maxOffset;

          div.className = "word";
          div.textContent = words[wordIndex % words.length];
          div.style.left = `${offset}px`;
          div.style.transform = `translateX(${offset}px)`;
          wordIndex++;
          fragment.appendChild(div);
        }

        content.appendChild(fragment);
      }

      appendWords();

      window.addEventListener("scroll", () => {
        const scrollBottom = window.innerHeight + window.scrollY;
        const pageHeight = document.documentElement.scrollHeight;

        if (pageHeight - scrollBottom < 1000) {
          appendWords();
        }
      });
    </script>
  </body>
</html>
