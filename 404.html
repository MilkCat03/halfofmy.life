<!DOCTYPE html>
<html>
    <head>
        <title>404 - not found</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/comic-mono@0.0.1/index.css">
        <style>
            html{
                background-image: url("media/404bg.jpg");
                background-size: 1%;
            }

            body{
                background-color: transparent;
                color:white;
                font-family: 'Times New Roman';
                overflow:hidden;
                margin:50px;
            }

            h1{
                font-size: 70px;
                margin: 10px;
                text-align: center;
            }

            h2{
                text-align: center;
                font-size: 70px;
                margin: 10px;
                white-space: nowrap;
                overflow: hidden;
            }

            h3{
                font-size: 40px;
                margin: 5px;
            }

            h5{
                font-size: 30px;
                margin: 5px;
            }

            p{
                font-size: 20px;
                margin: 5px;
            }
            
            a{
                color:blue;
                font-size: 50px;
            }

            #centered {
                text-align: center;
                margin-top: 6%;
            }

            #fourohfour{
                background-color: black;
                width:100%;
                height:89vh;
            }

            #bottomArrows {
                margin-top:3%;
            }
        </style>
    </head>
    <body>
        <div id="fourohfour">
            <h2 id="topArrows"></h2>
            <div id="centered">
                <h1>!!! 404 NOT FOUND !!!</h1>
                <p>oh no.</p>
                <p>it seems as if we are both lost</p>
                <p>.</p>
                <p>.</p>
                <p>.</p>
                <p>and nobody is coming to save us</p>
                <p>.</p>
                <p>.</p>
                <p>.</p>
                <p>unless</p>
                <p><a href="/index.html">we go home. together</a></p>
            </div>
            <h2 id="bottomArrows"></h2>
        </div>

        <script>
            const topArrows = document.getElementById('topArrows');
            const bottomArrows = document.getElementById('bottomArrows');

            const baseArrows = ['⬆', '⬇'];
            const etc = ['☻', '⌂', "☹", "%", "&", "-", "■", "?", "✍", "✔", "✕", "⨸"];

            function generateArrows(element) {
                const count = Math.ceil(element.offsetWidth / 45); 
                let str = '';
                
                for (let i = 0; i < count; i++) {
                    const isEasterEgg = Math.random() < 0.005; 
                    
                    if (isEasterEgg) {
                        str += etc[Math.floor(Math.random() * etc.length)];
                    } else {
                        str += baseArrows[Math.floor(Math.random() * baseArrows.length)];
                    }
                }
                return str;
            }

            function updateAll() {
                topArrows.textContent = generateArrows(topArrows);
                bottomArrows.textContent = generateArrows(bottomArrows);
            }

            updateAll();
            setInterval(updateAll, 500);
            window.addEventListener('resize', updateAll);
        </script>
    </body>
</html>
