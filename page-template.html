<!DOCTYPE html>
<html lang="en">
<head>
    <title>halfofmy.life</title>

    
    <style>
        html {
            font-family: "Comic Mono";
            color:white;
            background-image: url("media/background.jpg");
            background-size:500px;
            background-position: center;
            background-repeat: repeat;
        }

        body {
            width: 100%;
            height: 100%;
            margin: 15px;
            background-color: transparent;
        }

        #content {
            padding: 15px;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            background-color: rgba(0, 0, 0, 0.8);
            width: 97.5%;
            height: auto;
            margin-top:5px;    
        }

        h1 {
            font-size: 50px;
            margin-top: 10px;
            margin-bottom: 10px;
            color:orange;
            text-align:center;
        }

        #collapseThis {
            display: none;
            font-size: 20px;
            text-align: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            min-height: 250px;
            border: none;
            margin: 0;
            padding: 0;
            display: block;
        }

        #images {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }
        
        a{
            color:aqua;
        }
