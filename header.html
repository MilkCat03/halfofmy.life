<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/comic-mono@0.0.1/index.css">
    
    <style>
        *{
            overflow-x: hidden;
            overflow-y: hidden;
        }
        html {
            background-color: transparent;
            font-family: "Comic Mono";
            margin: 0;
            padding: 0;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            background-color: rgba(0, 0, 0, 0.8);
        }

        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            
        }

        #header-content {
            padding: 15px;
            background-color: transparent;
            width: calc(100% - 30px);
            height: auto;
            color: white;
            margin: 0;
            box-sizing: border-box;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            margin: 10px 0;
            justify-content: center;
        }

        .nav-button {
            background-color: transparent;
            color: white;
            border: 1px solid rgb(134, 134, 134);
            padding: 8px 16px;
            font-family: "Comic Mono";
            font-size: 35px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s, color 0.3s;
        }

        .nav-button:hover {
            background-color: white;
            color: black;
        }

        img {
            max-width: 65%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
    </style>
    <script src="onmobile.js"></script>
</head>
<body>
    <div id="header-content">
            <img src="half of my life logo.png">
            <hr>
            <div class="nav-buttons">
                <button style="color:yellow;" onclick="window.top.location='index.html'" class="nav-button">Home</button>
                <button style="color:blue;" onclick="window.top.location='art/'" class="nav-button">Art</button>
                <button style="color:greenyellow;" onclick="window.top.location='mymusic/'" class="nav-button">My Music</button>
                <button style="color:orange;" onclick="window.top.location='hobbies/'" class="nav-button">Hobbies</button>
                <button style="color:red;" onclick="window.top.location='blog/'" class="nav-button">Blog</button>
                <button style="color:lightskyblue;" onclick="window.top.location='me/'" class="nav-button">Me</button>
            </div>
            <hr>
    </div>
</body>
</html>
